name: PR preview lifecycle

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to reconcile against current GitHub state
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.repository_id }}-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview-control
    defaults:
      run:
        shell: bash
        working-directory: control
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - name: Read live PR state without executing PR source
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/preview-pr.json"
          jq -e --arg repo "$REPOSITORY" --arg base "$DEFAULT_BRANCH" \
            '.head.repo.full_name == $repo and .base.repo.full_name == $repo and .base.ref == $base' \
            "$RUNNER_TEMP/preview-pr.json" > /dev/null
          sha=$(jq -r .head.sha "$RUNNER_TEMP/preview-pr.json")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          state=$(jq -r .state "$RUNNER_TEMP/preview-pr.json")
          [[ "$state" == open || "$state" == closed ]]
          printf 'number=%s\nsha=%s\nstate=%s\n' "$NUMBER" "$sha" "$state" >> "$GITHUB_OUTPUT"
      - name: Check out application bytes only
        if: steps.pr.outputs.state == 'open'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false
          sparse-checkout: app
          submodules: false
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.7.13'
          enable-cache: false
      - name: Install pinned Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          pulumi-version: '3.273.0'
      - name: Acquire the pinned provider SDK and Python environment
        run: |
          set -euo pipefail
          uv venv --python 3.12.10
          pulumi package gen-sdk terraform-provider@1.0.1 \
            --language python --out sdks/neon --local -- \
            registry.opentofu.org/kislerdm/neon 0.18.0
          uv pip install --python .venv/bin/python \
            --require-hashes -r requirements.lock
          uv pip install --python .venv/bin/python \
            --require-hashes -r build-requirements.lock
          uv build sdks/neon/python --wheel --no-build-isolation \
            --python .venv/bin/python --out-dir sdk-wheels
          uv pip install --python .venv/bin/python --no-deps sdk-wheels/*.whl
      - name: Stage source without executing it
        if: steps.pr.outputs.state == 'open'
        env:
          PREVIEW_APP_SOURCE: ../pr/app
        run: .venv/bin/python stage_app.py
      - name: Reconcile only this PR stack
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          PREVIEW_TOKEN_SEED: ${{ secrets.PREVIEW_TOKEN_SEED }}
          PULUMI_ORG: ${{ vars.PULUMI_ORG }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
          VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          PR_STATE: ${{ steps.pr.outputs.state }}
        run: |
          set -euo pipefail
          test -n "$PULUMI_ORG"
          test -n "$NEON_PROJECT_ID"
          test -n "$NEON_PARENT_BRANCH_ID"
          test -n "$VERCEL_TEAM"
          scope=$(printf '%s' "${REPOSITORY,,}" | sha256sum | cut -c1-12)
          stack="$PULUMI_ORG/pr-previews-github-vercel-neon/r-$scope-pr-$NUMBER"
          pulumi stack select "$stack" --create --non-interactive
          if [[ "$PR_STATE" == closed ]]; then
            pulumi destroy --yes --refresh --non-interactive --suppress-outputs
            exit 0
          fi
          pulumi config set repository "$REPOSITORY"
          pulumi config set pullRequest "$NUMBER"
          pulumi config set commitSha "$HEAD_SHA"
          pulumi config set neonProjectId "$NEON_PROJECT_ID"
          pulumi config set parentBranchId "$NEON_PARENT_BRANCH_ID"
          pulumi config set vercel:team "$VERCEL_TEAM"
          printf '%s' "$PREVIEW_TOKEN_SEED" | pulumi config set apiTokenSeed --secret
          pulumi up --yes --refresh --non-interactive --suppress-outputs
          # A close during a build should not leave a preview waiting on the queue.
          state=$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq .state)
          if [[ "$state" == closed ]]; then
            pulumi destroy --yes --refresh --non-interactive --suppress-outputs
          fi
